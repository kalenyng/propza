<div class="app-shell" [class.sidebar-collapsed]="sidebarCollapsed()">
  <aside class="sidebar">
    <button
      type="button"
      class="sidebar-collapse-toggle"
      (click)="toggleSidebarCollapsed()"
      [attr.aria-expanded]="!sidebarCollapsed()"
      [attr.aria-label]="sidebarCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
    >
      <span
        class="sidebar-collapse-toggle__icon"
        [class.sidebar-collapse-toggle__icon--collapsed]="sidebarCollapsed()"
        aria-hidden="true"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="11 17 6 12 11 7"/>
          <polyline points="18 17 13 12 18 7"/>
        </svg>
      </span>
    </button>

    <div class="brand">
      <div class="brand-mark">
        <img class="brand-mark__logo" src="/propza-main.png" alt="Propza" />
      </div>
      <div class="brand-copy">
        <div class="brand-name">Propza</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/dashboard" routerLinkActive="active" class="sidebar-link" aria-label="Dashboard" title="Dashboard">
        <span class="nav-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
          </svg>
        </span>
        <span class="sidebar-link__label">Dashboard</span>
      </a>
      <a routerLink="/properties" [class.active]="propertiesNavActive()" class="sidebar-link" aria-label="Properties" title="Properties">
        <span class="nav-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </span>
        <span class="sidebar-link__label">Properties</span>
      </a>
      <a routerLink="/tenants" [class.active]="tenantsNavActive()" class="sidebar-link" aria-label="Tenants" title="Tenants">
        <span class="nav-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </span>
        <span class="sidebar-link__label">Tenants</span>
      </a>
      <a routerLink="/payments" routerLinkActive="active" class="sidebar-link" aria-label="Payments" title="Payments">
        <span class="nav-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
            <line x1="1" y1="10" x2="23" y2="10"/>
          </svg>
        </span>
        <span class="sidebar-link__label">Payments</span>
      </a>
    </nav>

    <button
      class="settings-profile"
      type="button"
      (click)="openSettings()"
      [attr.title]="'Settings — ' + (userDisplayName || userEmail || 'Profile')"
    >
      <img
        *ngIf="avatarUrl; else avatarFallback"
        [src]="avatarUrl"
        [alt]="userDisplayName || 'Profile'"
        class="avatar"
      />
      <ng-template #avatarFallback>
        <div class="avatar avatar-fallback">{{ avatarInitialLetter }}</div>
      </ng-template>
      <div class="profile-copy">
        <span class="settings-label">Settings</span>
        <span class="profile-name">{{ userDisplayName || userEmail || 'Profile' }}</span>
      </div>
    </button>
  </aside>

  <div class="shell-content">
    <div class="mobile-app-shell" [class.mobile-app-shell--no-hero]="hideMobileHero()">
      <!-- Fixed: green + title stay in viewport until white sheet scrolls over -->
      <div class="mobile-hero">
        <div class="mobile-background-layer" aria-hidden="true"></div>
        <header class="mobile-header">
          <h1 class="mobile-header-title">{{ mobileShellTitle() }}</h1>
        </header>
      </div>

      <!-- Reserves document height so the sheet starts below the hero -->
      <div class="mobile-hero-spacer" aria-hidden="true"></div>

      <!-- In-flow: scrolls WITH the document — no overflow-y on this element -->
      <main class="mobile-content-surface">
        <router-outlet />
      </main>

      <nav class="mobile-bottom-nav" aria-label="Primary navigation">
        <a
          routerLink="/dashboard"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="mobile-bottom-nav__link"
          aria-label="Dashboard"
        >
          <span class="mobile-bottom-nav__icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
              <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
            </svg>
          </span>
          <span class="mobile-bottom-nav__label">Dash</span>
        </a>
        <a
          routerLink="/properties"
          [class.active]="propertiesNavActive()"
          class="mobile-bottom-nav__link"
          aria-label="Properties"
        >
          <span class="mobile-bottom-nav__icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
          </span>
          <span class="mobile-bottom-nav__label">Props</span>
        </a>
        <a routerLink="/tenants" [class.active]="tenantsNavActive()" class="mobile-bottom-nav__link" aria-label="Tenants">
          <span class="mobile-bottom-nav__icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </span>
          <span class="mobile-bottom-nav__label">Tenants</span>
        </a>
        <a routerLink="/payments" routerLinkActive="active" class="mobile-bottom-nav__link" aria-label="Payments">
          <span class="mobile-bottom-nav__icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
              <line x1="1" y1="10" x2="23" y2="10"/>
            </svg>
          </span>
          <span class="mobile-bottom-nav__label">Pay</span>
        </a>
        <a routerLink="/settings" routerLinkActive="active" class="mobile-bottom-nav__link" aria-label="Settings">
          <span class="mobile-bottom-nav__icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
          </span>
          <span class="mobile-bottom-nav__label">Settings</span>
        </a>
      </nav>
    </div>
  </div>
</div>
