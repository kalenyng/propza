<div class="preloader">
  <div class="preloader-content">
    <div class="logo-wrapper">
      <img 
        src="/propza-main.gif" 
        alt="Propza" 
        class="logo-image logo-gif"
        [class.fade-out]="!showGif">
      <img 
        src="/final-frame.png" 
        alt="Propza" 
        class="logo-image logo-png"
        [class.fade-in]="showPng">
    </div>
    <div class="spinner-container">
      <div class="spinner-ring"></div>
    </div>
    <div class="loading-text">Loading...</div>
  </div>
  
  <!-- Hidden preload image to ensure PNG is cached -->
  <img 
    src="/final-frame.png" 
    alt="Preload" 
    style="display: none;"
    class="preload-image">
</div>
