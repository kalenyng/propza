<div 
  class="confirmation-modal-overlay" 
  *ngIf="isVisible()" 
  [@fadeIn]
  (click)="onOverlayClick()"
>
  <div class="confirmation-modal" [@slideUp] (click)="$event.stopPropagation()">
    <div class="confirmation-modal-header" [ngClass]="options()?.type || 'warning'">
      <div class="confirmation-modal-icon">
        <svg 
          *ngIf="options()?.type === 'danger'" 
          width="48" 
          height="48" 
          viewBox="0 0 24 24" 
          fill="none" 
          stroke="currentColor" 
          stroke-width="2"
        >
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        <svg 
          *ngIf="options()?.type !== 'danger'" 
          width="48" 
          height="48" 
          viewBox="0 0 24 24" 
          fill="none" 
          stroke="currentColor" 
          stroke-width="2"
        >
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      </div>
      <h2>{{ options()?.title }}</h2>
    </div>

    <div class="confirmation-modal-body">
      <p>{{ options()?.message }}</p>
    </div>

    <div class="confirmation-modal-footer">
      <button 
        class="btn btn-cancel" 
        (click)="onCancel()"
        type="button"
      >
        {{ options()?.cancelText || 'Cancel' }}
      </button>
      <button 
        class="btn btn-confirm" 
        [ngClass]="options()?.type || 'warning'"
        (click)="onConfirm()"
        type="button"
      >
        {{ options()?.confirmText || 'Confirm' }}
      </button>
    </div>
  </div>
</div>
