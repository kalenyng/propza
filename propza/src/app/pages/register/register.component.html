<div class="auth-container">
  <div class="auth-card">
    <!-- Logo/Brand -->
    <div class="brand">
      <div class="logo">P</div>
      <h1>Propza</h1>
      <p class="tagline">Property management made simple</p>
    </div>

    <h2>Create your account</h2>

    <!-- Google Sign-In Button -->
    <button 
      type="button" 
      class="btn-google"
      (click)="signInWithGoogle()"
      [disabled]="loading">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <path d="M19.6 10.227c0-.709-.064-1.39-.182-2.045H10v3.868h5.382a4.6 4.6 0 01-1.996 3.018v2.51h3.232c1.891-1.742 2.982-4.305 2.982-7.35z" fill="#4285F4"/>
        <path d="M10 20c2.7 0 4.964-.895 6.618-2.423l-3.232-2.509c-.895.6-2.04.955-3.386.955-2.605 0-4.81-1.76-5.595-4.123H1.064v2.59A9.996 9.996 0 0010 20z" fill="#34A853"/>
        <path d="M4.405 11.9c-.2-.6-.314-1.24-.314-1.9 0-.66.114-1.3.314-1.9V5.51H1.064A9.996 9.996 0 000 10c0 1.614.386 3.14 1.064 4.49l3.34-2.59z" fill="#FBBC04"/>
        <path d="M10 3.977c1.468 0 2.786.505 3.823 1.496l2.868-2.868C14.959.99 12.695 0 10 0 6.09 0 2.71 2.24 1.064 5.51l3.34 2.59C5.19 5.736 7.395 3.977 10 3.977z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <!-- Divider -->
    <div class="divider">
      <span>or</span>
    </div>

    <!-- Email/Password Form -->
    <form (ngSubmit)="register()" #form="ngForm">
      <div class="form-group">
        <label for="fullName">Full name</label>
        <input
          id="fullName"
          type="text"
          name="fullName"
          [(ngModel)]="fullName"
          placeholder="John Doe"
          required
          minlength="2"
        />
      </div>

      <div class="form-group">
        <label for="email">Email address</label>
        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="you@example.com"
          required
          email
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Create a strong password"
          required
          minlength="6"
        />
        <small class="form-hint">At least 6 characters</small>
      </div>

      <button 
        type="submit" 
        class="btn-primary"
        [disabled]="loading || form.invalid">
        {{ loading ? 'Creating account...' : 'Create account' }}
      </button>
    </form>

    <!-- Messages -->
    <p *ngIf="message" class="message success">{{ message }}</p>
    <p *ngIf="errorMsg" class="message error">{{ errorMsg }}</p>

    <!-- Sign In Link -->
    <div class="footer-link">
      <span>Already have an account?</span>
      <a routerLink="/login">Sign in</a>
    </div>

    <!-- Terms -->
    <p class="terms">
      By creating an account, you agree to our Terms of Service and Privacy Policy
    </p>
  </div>
</div>
