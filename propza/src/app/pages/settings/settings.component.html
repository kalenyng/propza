<div class="settings-container settings-page">
  <app-header-banner logoLetter="P"/>

  <!-- Main content shell to match other pages -->
  <div class="main-content">
    <!-- Sliding pages wrapper -->
    <div class="settings-wrapper" [@slideAnimation]="activePage">
    <!-- MAIN PAGE -->
    <div class="settings-page main" *ngIf="activePage==='main'">
      <div class="content-header">
        <h1>Settings</h1>
      </div>
      <ul class="settings-list main-list">
        <li (click)="goTo('account')">Account</li>
        <li (click)="goTo('preferences')">Preferences</li>
        <li (click)="goTo('data')">Data</li>
        <li (click)="goTo('support')">Support</li>
      </ul>
    </div>

    <!-- ACCOUNT PAGE -->
    <div class="settings-page subpage" *ngIf="activePage==='account'">
      <div class="page-header">
        <button class="back-btn" (click)="goTo('main')">←</button>
        <h3>Account Settings</h3>
      </div>
      <div class="settings-card">
        <div class="settings-list">
          <div class="setting-item setting-row">
            <span class="setting-text">{{ displayName || (firstName + ' ' + lastName) }}</span>
            <button class="btn-primary btn-compact" (click)="openEditName()">Edit Name</button>
          </div>
          <div class="setting-item setting-row">
            <span class="setting-text">{{ userEmail }}</span>
          </div>
          <div class="setting-item">
            <span class="setting-label">Member since</span>
            <span>{{ createdAt }}</span>
          </div>
          <div class="setting-item settings-actions">
            <button class="btn-sign-out" (click)="signOut()">{{ translate.t('button.signOut') }}</button>
            <button class="btn-danger" (click)="confirmDelete()">Delete account</button>
          </div>
        </div>
      </div>
    </div>

    <!-- PREFERENCES PAGE -->
    <div class="settings-page subpage" *ngIf="activePage==='preferences'">
      <div class="page-header">
        <button class="back-btn" (click)="goTo('main')">←</button>
        <h3>Preferences</h3>
      </div>
      <div class="settings-card">
        <div class="settings-list">
          <div class="setting-item setting-select">
            <span class="setting-label">Theme</span>
            <select class="language-select" [(ngModel)]="selectedTheme" (ngModelChange)="onThemeChange($event)">
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </div>
          <div class="setting-item setting-select">
            <span class="setting-label">Language</span>
            <select class="language-select" (change)="changeLanguage($any($event.target).value)">
              <option value="en" [selected]="translate.currentLanguage() === 'en'">English</option>
              <option value="af" [selected]="translate.currentLanguage() === 'af'">Afrikaans</option>
              <option value="zu" [selected]="translate.currentLanguage() === 'zu'">isiZulu</option>
              <option value="xh" [selected]="translate.currentLanguage() === 'xh'">isiXhosa</option>
            </select>
          </div>
          <div class="setting-item">
            <div class="setting-label-group">
              <span class="setting-label">Email me payment reminders and tenant updates</span>
              <span class="coming-soon-label">Coming Soon</span>
            </div>
            <label class="switch">
              <input type="checkbox" [checked]="notificationsEnabled" (change)="toggleNotifications()" disabled />
              <span class="slider"></span>
            </label>
          </div>
        </div>
      </div>
    </div>

    <!-- DATA PAGE -->
    <div class="settings-page subpage" *ngIf="activePage==='data'">
      <div class="page-header">
        <button class="back-btn" (click)="goTo('main')">←</button>
        <h3>Data</h3>
      </div>
      <div class="settings-card">
        <div class="settings-list">
          <div class="setting-item settings-actions">
            <button class="btn-primary" (click)="exportMyData()">Export My Data</button>
          </div>
        </div>
      </div>
    </div>

    <!-- SUPPORT PAGE -->
    <div class="settings-page subpage" *ngIf="activePage==='support'">
      <div class="page-header">
        <button class="back-btn" (click)="goTo('main')">←</button>
        <h3>Support</h3>
      </div>
      <div class="settings-card">
        <div class="settings-list">
          <div class="setting-item settings-actions">
            <button class="btn-primary" (click)="contactSupport()">Contact Support</button>
            <button class="btn-secondary" (click)="sendFeedback()">Send Feedback</button>
          </div>
        </div>
      </div>
    </div>
    </div>
  </div>

  <app-bottom-nav />
</div>
