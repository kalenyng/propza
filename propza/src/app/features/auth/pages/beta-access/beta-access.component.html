<div class="auth-container">
  <div class="auth-card">
    <!-- Logo/Brand -->
    <div class="brand">
      <img class="brand-image" src="/propzaMain.png" alt="Propza" />
      <p class="tagline">Smarter renting starts here</p>
    </div>

    <h2>Beta Access</h2>
    <p class="subtitle">Enter your 6-digit access code to continue</p>

    <div class="code-input-section">
      <div class="digit-inputs">
        @for (digit of digits(); track $index) {
          <div class="digit-wrapper">
            <input
              type="text"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="1"
              class="digit-input"
              [value]="digit"
              (input)="onDigitInput($index, $event)"
              (keydown)="onDigitKeydown($index, $event)"
              (paste)="onPaste($event)"
              [attr.aria-label]="'Digit ' + ($index + 1)"
            />
          </div>
        }
      </div>

      @if (errorMessage()) {
        <p class="message error">{{ errorMessage() }}</p>
      }

      <button 
        class="btn-primary" 
        (click)="validateAccess()"
        [disabled]="digits().join('').length !== 6"
      >
        Continue
      </button>
    </div>

    <div class="footer-link">
      <span>Don't have an access code? Contact kalenyoung03&#64;gmail.com</span>
    </div>
  </div>
</div>
