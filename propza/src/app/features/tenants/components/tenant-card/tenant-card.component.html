<div class="tenant-card" [class.overdue]="isOverdue" (click)="onCardClick()">
  <div class="card-header">
    <div class="card-left">
      <h3 class="tenant-name">{{ tenant.name }}</h3>
      <p class="property-address">{{ propertyAddress }}</p>
    </div>
    <div class="card-right">
      <div class="status-pill" [attr.data-color]="statusColor" *ngIf="isOverdue">
        <span class="status-dot"></span>
        <span class="status-label">{{ statusLabel }}</span>
      </div>
    </div>
  </div>

  <div class="card-body">
    <div class="card-bottom-left">
      @if (isOverdue) {
        <p class="due-date overdue">
          Due: {{ formattedDueDate }}
        </p>
      }
      <div class="contact-info">
        <div class="contact-item" *ngIf="tenant.email">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <span>{{ tenant.email }}</span>
        </div>
        <div class="contact-item" *ngIf="tenant.phone">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
          <span>{{ tenant.phone }}</span>
        </div>
      </div>
    </div>
    <div class="card-bottom-right">
      <p class="rent-amount">{{ formattedRent }}</p>
    </div>
  </div>

  <div class="chevron-icon">
    <svg width="8" height="14" viewBox="0 0 8 14" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M1 1L7 7L1 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
</div>
